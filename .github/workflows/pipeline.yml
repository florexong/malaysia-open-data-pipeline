name: Ingest

# Weekly pull of every registered dataset. Fuel prices are published Wednesday
# 23:59 MYT (15:59 UTC), so run Thursday 02:00 UTC (10:00 MYT).
on:
  schedule:
    - cron: "0 2 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python -m ingestion.datagovmy --all
      # Raw Parquet is kept as a build artifact until the cloud phase gives it a real home.
      - uses: actions/upload-artifact@v4
        with:
          name: raw-parquet-${{ github.run_id }}
          path: data/raw/
          retention-days: 30
          if-no-files-found: error
